# BionicPRO full stack: Keycloak + frontend (Task 1) and the reports data
# pipeline (Task 2): CRM DB + Telemetry DB -> Airflow ETL -> ClickHouse mart
# -> Reports API -> frontend. Dev-only credentials come from .env
# (`cp .env.example .env`); every value also has an inline dev default.

x-airflow-common: &airflow-common
  build: ./airflow
  image: bionicpro/airflow:local
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow_db:5432/${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-Zp8kP3sJ2rN6vY9wQ1xT4uH7bL0cD5eF8gA2mK6nR3s=}
    AIRFLOW__WEBSERVER__SECRET_KEY: bionicpro-dev-webserver-secret
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # --- connection coordinates consumed by the DAG (os.environ) ---
    CRM_DB_HOST: crm_db
    CRM_DB_PORT: "5432"
    CRM_DB_NAME: ${CRM_DB_NAME:-crm}
    CRM_DB_USER: ${CRM_DB_USER:-crm_user}
    CRM_DB_PASSWORD: ${CRM_DB_PASSWORD:-crm_password}
    TELEMETRY_DB_HOST: telemetry_db
    TELEMETRY_DB_PORT: "5432"
    TELEMETRY_DB_NAME: ${TELEMETRY_DB_NAME:-telemetry}
    TELEMETRY_DB_USER: ${TELEMETRY_DB_USER:-telemetry_user}
    TELEMETRY_DB_PASSWORD: ${TELEMETRY_DB_PASSWORD:-telemetry_password}
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "8123"
    CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_password}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./sql:/opt/airflow/sql:ro
    - airflow_logs:/opt/airflow/logs
    - airflow_data:/opt/airflow/data
  user: "50000:0"

services:
  # ======================= Keycloak (Task 1) ===============================
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: ${KC_DB_NAME:-keycloak_db}
      POSTGRES_USER: ${KC_DB_USER:-keycloak_user}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak_password}
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER:-keycloak_user} -d ${KC_DB_NAME:-keycloak_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/${KC_DB_NAME:-keycloak_db}
      KC_DB_USERNAME: ${KC_DB_USER:-keycloak_user}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak_password}
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      keycloak_db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_REPORTS_API_URL: http://localhost:8000
      REACT_APP_KEYCLOAK_URL: http://localhost:8080
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend

  # ======================= Source databases (Task 2) =======================
  crm_db:
    image: postgres:14
    environment:
      POSTGRES_DB: ${CRM_DB_NAME:-crm}
      POSTGRES_USER: ${CRM_DB_USER:-crm_user}
      POSTGRES_PASSWORD: ${CRM_DB_PASSWORD:-crm_password}
    volumes:
      - crm_db_data:/var/lib/postgresql/data
      - ./crm/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CRM_DB_USER:-crm_user} -d ${CRM_DB_NAME:-crm}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  telemetry_db:
    image: postgres:14
    environment:
      POSTGRES_DB: ${TELEMETRY_DB_NAME:-telemetry}
      POSTGRES_USER: ${TELEMETRY_DB_USER:-telemetry_user}
      POSTGRES_PASSWORD: ${TELEMETRY_DB_PASSWORD:-telemetry_password}
    volumes:
      - telemetry_db_data:/var/lib/postgresql/data
      - ./telemetry/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TELEMETRY_DB_USER:-telemetry_user} -d ${TELEMETRY_DB_NAME:-telemetry}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ======================= OLAP (Task 2) ===================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ======================= Airflow ETL (Task 2) ============================
  airflow_db:
    image: postgres:14
    environment:
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow} -d ${AIRFLOW_DB_NAME:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USER}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
    restart: "no"
    depends_on:
      airflow_db:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      airflow_db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      airflow_db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      crm_db:
        condition: service_healthy
      telemetry_db:
        condition: service_healthy

  # ======================= Reports API (Task 3/4) ==========================
  reports-api:
    build:
      context: ./reports-api
      dockerfile: Dockerfile
    environment:
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/reports-realm}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-reports-realm}
      REPORTS_API_AUDIENCE: ${REPORTS_API_AUDIENCE:-reports-api}
      REPORTS_REQUIRED_ROLE: ${REPORTS_REQUIRED_ROLE:-prothetic_user}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_password}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-default}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      clickhouse:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  crm_db_data:
  telemetry_db_data:
  airflow_db_data:
  clickhouse_data:
  airflow_logs:
  airflow_data:
